name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web app and CLI
        run: |
          pnpm build
          pnpm build:cli

      - name: Build Electron bundles
        run: pnpm build:electron

      - name: CLI smoke test
        run: |
          node bin/agent-deck.js --version
          node bin/agent-deck.js --help > /dev/null

      - name: Package dry run
        run: npm pack --dry-run

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
